<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <!-- Superfície Carbono Antigravity -->
    <linearGradient id="soil-fav-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14161C" />
      <stop offset="55%" stop-color="#0C0D11" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>

    <!-- Brilho Orbital Âmbar/Ouro no Topo Direito -->
    <radialGradient id="soil-fav-glow" cx="390" cy="100" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE432" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#FBBC04" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FBBC04" stop-opacity="0" />
    </radialGradient>

    <!-- Borda Sutil Metálica + Âmbar -->
    <linearGradient id="soil-fav-border" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE432" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FBBC04" stop-opacity="0.24" />
    </linearGradient>

    <!-- Gradiente Platina do Monograma Oficial 's' -->
    <linearGradient id="soil-fav-s" x1="65" y1="164" x2="447" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8F9FA" />
      <stop offset="100%" stop-color="#ECEEF2" />
    </linearGradient>

    <!-- Gradiente Âmbar Lubrificante da Barra de Velocidade -->
    <linearGradient id="soil-fav-gold" x1="307" y1="98" x2="444" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE432" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#soil-fav-bg)" />
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#soil-fav-glow)" />
  <rect x="11" y="11" width="490" height="490" rx="113" stroke="url(#soil-fav-border)" stroke-width="6" />

  <!-- Barra de Velocidade Âmbar/Ouro (inclinação 63.4° da tipografia SOIL) -->
  <path
    fill="url(#soil-fav-gold)"
    d="M 326 98 L 438 98 L 443 101 L 444 107 L 432 131 L 425 136 L 313 136 L 308 133 L 307 127 L 319 103 Z"
  />

  <!-- Monograma Oficial 's' extraído de logo-soil.svg -->
