openapi: 3.1.0
info:
  title: Soil Automotive SaaS API
  version: 2.0.0
  description: >
    API RESTful Multi-Tenant para consulta técnica dos 6 itens obrigatórios de lubrificação/filtragem
    com desambiguação de veículos e geração/envio de orçamentos em 3 faixas (Mais Barato, Melhor Qualidade e Mais Caro).
servers:
  - url: https://api.engine.lat
    description: Servidor de Produção (engine.lat)
  - url: http://localhost:3000
    description: Desenvolvimento Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /health:
    get:
      summary: Healthcheck do servidor
      responses:
        '200':
          description: Servidor operacional
  /api/companies:
    post:
      summary: RF01 - Cadastrar Empresa (CNPJ único validado por Módulo 11)
      responses:
        '201':
          description: Empresa cadastrada
        '409':
          description: CNPJ já existente
        '422':
          description: CNPJ ou Nome Fantasia inválido
  /api/auth/signup:
    post:
      summary: RF02 - Cadastrar Usuário (Operador) vinculado a um CNPJ existente
      responses:
        '201':
          description: Usuário criado como PENDING
        '404':
          description: CNPJ não encontrado
        '409':
          description: E-mail ou Login duplicado
  /api/auth/login:
    post:
      summary: RF03 - Autenticar por Login ou E-mail e emitir token JWT
      responses:
        '200':
          description: Autenticado com sucesso
        '401':
          description: Credenciais inválidas
  /api/admin/users:
    get:
      summary: RF03 - Listar contas de operadores por status (PENDING, APPROVED, REJECTED ou ALL) enriquecidas com o Nome Fantasia da oficina (Exclusivo ADMIN)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de contas de operadores e oficinas credenciadas
        '403':
          description: Acesso negado (não-ADMIN)
  /api/admin/users/{id}/review:
    post:
      summary: RF03 - Aprovar ou rejeitar conta pendente (Exclusivo ADMIN)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Status atualizado
        '403':
          description: Acesso negado (não-ADMIN)
  /api/vehicles/disambiguate:
    get:
      summary: RF08 - Busca aproximada com indicador de desambiguação de veículos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de veículos candidatos e flag requiresDisambiguation
  /api/vehicles:
    post:
      summary: RF04 - Cadastrar veículo na frota (Exclusivo ADMIN)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Veículo cadastrado
  /api/vehicles/{id}:
    patch:
      summary: RF04 - Atualizar dados de veículo homologado na frota (Exclusivo ADMIN)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Veículo atualizado e cache LRU limpo
        '404':
          description: Veículo não encontrado
    delete:
      summary: RF04 - Excluir veículo (Exclusivo ADMIN)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Veículo removido
  /api/catalogs:
    get:
      summary: RF05 - Listar especificações técnicas dos 6 itens obrigatórios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de itens do catálogo técnico
    post:
      summary: RF05 - Cadastrar especificação técnica dos 6 itens obrigatórios (Exclusivo ADMIN)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Item de catálogo criado
  /api/catalogs/{id}:
    patch:
      summary: RF05 - Atualizar norma ou subtipo de especificação técnica do catálogo (Exclusivo ADMIN)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Item de catálogo atualizado e cache LRU limpo
        '404':
          description: Item de catálogo não encontrado
    delete:
      summary: RF05 - Excluir especificação técnica do catálogo (Exclusivo ADMIN)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Item removido
  /api/technical-specifications:
    post:
      summary: RF05 - Vincular especificação técnica e litragem a um veículo (Exclusivo ADMIN)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Especificação vinculada ao veículo
  /api/products:
    get:
      summary: RF06 - Listar estoque de produtos e preços do CNPJ autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de produtos do CNPJ
    post:
      summary: RF06 - Cadastrar produto comercial no estoque do CNPJ autenticado
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Produto cadastrado
  /api/products/{id}:
    patch:
      summary: RF06 - Atualizar preço, código ou aplicação de produto existente no estoque do CNPJ autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Produto atualizado e cache LRU do CNPJ invalidado
        '404':
          description: Produto não encontrado no estoque deste CNPJ
    delete:
      summary: RF06 - Remover produto do estoque do CNPJ autenticado
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Produto removido
  /api/products/batch:
    post:
      summary: RF06 - Importar ou atualizar produtos e preços em lote (CSV/Batch) no estoque do CNPJ autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lote de produtos processado (criados e atualizados) com invalidação do cache LRU
  /api/clients:
    get:
      summary: RF07 - Listar carteira de clientes do CNPJ autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de clientes da oficina
    post:
      summary: RF07 - Cadastrar cliente vinculado ao CNPJ autenticado
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Cliente cadastrado
        '409':
          description: Cliente já cadastrado neste CNPJ
  /api/clients/{id}:
    patch:
      summary: RF07 - Atualizar nome, telefone ou e-mail de cliente existente no CNPJ autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do cliente atualizados
        '404':
          description: Cliente não encontrado neste CNPJ
        '409':
          description: Conflito de e-mail ou telefone com outro cliente do mesmo CNPJ
    delete:
      summary: RF07 - Excluir cliente do CNPJ autenticado sem afetar outros CNPJs
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Cliente excluído
  /api/lookup/{vehicleId}:
    get:
      summary: RF08 - Retornar os 6 itens técnicos do veículo + produtos disponíveis no CNPJ autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Especificações técnicas e produtos compatíveis
  /api/quotes/options/{vehicleId}:
    get:
      summary: RF09 - Gerar automaticamente as 3 opções de orçamento (Mais Barato, Melhor Qualidade, Mais Caro)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pacotes calculados nas 3 faixas
  /api/quotes:
    get:
      summary: RF09 - Listar orçamentos emitidos pelo CNPJ autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de orçamentos do CNPJ
    post:
      summary: RF09 - Criar ou manipular orçamento (itens, quantidades, preços e cliente destinatário)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Orçamento salvo e total recalculado em centavos
  /api/quotes/{id}:
    delete:
      summary: RF09 - Excluir orçamento do histórico do CNPJ autenticado
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Orçamento excluído
        '404':
          description: Orçamento não encontrado neste CNPJ
  /api/quotes/{id}/send-email:
    post:
      summary: RF10 - Disparar orçamento formatado para o e-mail do cliente via SMTP
      security:
        - bearerAuth: []
      responses:
        '200':
          description: E-mail enviado e status atualizado para SENT
